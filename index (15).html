<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bilgi TTO · İş Takibi</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#e3101c;--deep:#b5001f;--pink:#ff5a6e;--tint:#fdeced;--ink:#16181d;--mu:#6a707b;--line:#e8e9ec;--bg:#f6f6f8;--card:#fff;--ok:#12805c;--okbg:#e3f4ee;--chip:#eef0f3;--sh:0 1px 2px rgba(20,20,40,.04),0 8px 24px -12px rgba(20,20,40,.12)}
@media(prefers-color-scheme:dark){:root{--ink:#f1f2f4;--mu:#9aa1ad;--line:#2b2e36;--bg:#0f1013;--card:#181a1f;--tint:#2a1519;--okbg:#10291f;--chip:#23262d;--ok:#3ac494;--sh:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
header{background:var(--card);border-bottom:1px solid var(--line)}
.w{max-width:880px;margin:0 auto;padding:0 20px}
header .w{display:flex;align-items:center;justify-content:space-between;height:68px}
header img{height:42px;display:block}
.tools{display:flex;gap:8px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:7px 12px;color:var(--mu);font-size:13px;font-weight:600}
.ghost:hover{border-color:var(--red);color:var(--red)}
.hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;margin:28px 0 20px;padding:26px;border-radius:24px;color:#fff;background:linear-gradient(135deg,#e3101c,#ff5a6e);box-shadow:0 24px 50px -26px rgba(181,0,31,.7)}
.ring{position:relative;width:112px;height:112px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bg{stroke:rgba(255,255,255,.28)}.ring .fg{stroke:#fff;transition:stroke-dashoffset .5s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-weight:800}
.hero h1{margin:0;font-size:28px;line-height:1.15;letter-spacing:-.02em;font-weight:800}
.hero p{margin:6px 0 16px;opacity:.9;font-size:14px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.st{background:rgba(255,255,255,.18);border-radius:14px;padding:8px 16px;min-width:92px}
.st b{display:block;font-size:22px;line-height:1.2;font-weight:800}.st span{font-size:12px;opacity:.9}
.add{display:flex;gap:8px;flex-wrap:wrap;background:var(--card);border-radius:18px;padding:10px;box-shadow:var(--sh);border:1px solid var(--line)}
.add input[type=text]{flex:1 1 240px;border:0;background:transparent;padding:11px 12px;outline:0}
.add select,.add input[type=date]{border:1.5px solid var(--line);border-radius:12px;padding:9px 10px;background:var(--card)}
.btn{background:var(--red);color:#fff;border:0;border-radius:12px;padding:11px 22px;font-weight:700}
.btn:hover{background:var(--deep)}.btn:disabled{opacity:.45;cursor:default}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:22px 0 12px}
.tabs{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:99px}
.tabs button{border:0;background:transparent;color:var(--mu);padding:7px 16px;border-radius:99px;font-weight:600;font-size:14px}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tabs i{font-style:normal;font-size:12px;opacity:.7;margin-left:4px}
.q{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:8px 16px;min-width:200px;outline:0}
.q:focus{border-color:var(--red)}
.list{display:grid;gap:10px}
.it{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--sh);border-left:5px solid var(--red)}
.it.rev{border-left-color:#f5a000}.it.done{border-left-color:var(--line);box-shadow:none}
.chk{appearance:none;flex:none;width:26px;height:26px;border:2px solid #c6cad2;border-radius:50%;background:transparent;display:grid;place-items:center;margin:0;cursor:pointer}
.chk:hover{border-color:var(--red)}
.chk:checked{background:var(--red);border-color:var(--red)}
.chk:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.bd{flex:1;min-width:0}
.tx{font-weight:600;word-break:break-word}
.it.done .tx{color:var(--mu);font-weight:500;text-decoration:line-through}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;font-size:12.5px;color:var(--mu);align-items:center}
.pill{border-radius:99px;padding:1px 10px;font-weight:600;background:var(--chip)}
.pill.rev{background:#fff2d6;color:#9a6200}.pill.late{background:var(--tint);color:var(--deep)}.pill.ok{background:var(--okbg);color:var(--ok)}
@media(prefers-color-scheme:dark){.pill.rev{background:#33270c;color:#f5b73a}.pill.late{color:#ff7b8a}}
.ac{display:flex;gap:2px}
.ic{background:transparent;border:0;color:var(--mu);width:34px;height:34px;border-radius:10px;font-size:17px;line-height:1}
.ic:hover{background:var(--tint);color:var(--red)}.ic.arm{width:auto;padding:0 10px;font-size:13px;font-weight:700;color:var(--deep)}
.empty{text-align:center;color:var(--mu);padding:44px 20px;background:var(--card);border:1px dashed var(--line);border-radius:16px}
.empty b{display:block;font-size:34px;margin-bottom:6px}
footer{color:var(--mu);font-size:12.5px;text-align:center;padding:26px 0 48px}
#msg{min-height:20px}
.mig{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--tint);border:1px solid var(--red);border-radius:16px;padding:12px 16px;margin-bottom:12px;font-weight:600}
.mig[hidden]{display:none}
@media(max-width:560px){.hero{grid-template-columns:1fr;text-align:center;justify-items:center}.stats{justify-content:center}.q{width:100%}}
</style>
</head>

<div class="tools"><button class="ghost" id="exp">Yedek al</button><button class="ghost" id="imp">Yedekten yükle</button><input type="file" id="file" accept="application/json" hidden></div></div></header>
<main class="w">
  <section class="hero">
    <div class="ring"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="42"/><circle class="fg" id="fg" cx="50" cy="50" r="42" stroke-dasharray="263.9" stroke-dashoffset="263.9"/></svg><b id="pct">0%</b></div>
    <div><h1>İş takibi</h1><p id="sub"></p>
      <div class="stats"><div class="st"><b id="s1">0</b><span>Toplam</span></div><div class="st"><b id="s2">0</b><span>Yapılacak</span></div><div class="st"><b id="s3">0</b><span>Yapıldı</span></div></div></div>
  </section>
  <div class="mig" id="mig" hidden><span id="migText"></span><button class="btn" id="migBtn" type="button">Ortak listeye aktar</button></div>
  <div class="add">
    <input type="text" id="t" placeholder="Yeni iş ya da revizyon yazın" maxlength="300" aria-label="Yeni iş">
    <select id="k" aria-label="Tür"><option value="is">İş</option><option value="rev">Revizyon</option></select>
    <input type="date" id="d" aria-label="Son tarih" title="Son tarih (isteğe bağlı)">
    <button class="btn" id="add" disabled>Ekle</button>
  </div>
  <div class="bar">
    <div class="tabs" id="tabs"><button data-f="all" class="on">Hepsi<i id="c1"></i></button><button data-f="open">Yapılacak<i id="c2"></i></button><button data-f="done">Yapıldı<i id="c3"></i></button></div>
    <input class="q" id="q" type="search" placeholder="Ara…" aria-label="Ara">
  </div>
  <div class="list" id="list"></div>
  <footer><div id="msg"></div></footer>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot, writeBatch }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBOOylO-547nn1YVurb2AKNFbstRjHUv_Y",
  authDomain: "bilgi-tto-takip.firebaseapp.com",
  projectId: "bilgi-tto-takip",
  storageBucket: "bilgi-tto-takip.firebasestorage.app",
  messagingSenderId: "959009155915",
  appId: "1:959009155915:web:2d6f0b9f2f423a2f6296ce"
};
const db = getFirestore(initializeApp(firebaseConfig));
const col = collection(db, "isler");

var $=function(i){return document.getElementById(i)};
var KEY='tto-is-takibi',rows=[],filter='all',query='',armed=null;
var DEFAULT_MSG='İşler ortak veritabanında saklanır; linke sahip herkes görebilir, ekleyebilir ve işaretleyebilir. Düzenli “Yedek al” yapmanız önerilir.';
function say(m){$('msg').textContent=m||DEFAULT_MSG}
function fail(e,m){console.error(e);say(m||'Kaydedilemedi. İnternet bağlantınızı kontrol edip tekrar deneyin.')}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function fmt(v){return new Date(v).toLocaleString('tr-TR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function fmtDue(s){return new Date(s+'T00:00').toLocaleDateString('tr-TR',{day:'numeric',month:'short'})}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function find(id){return rows.filter(function(x){return x.id===id})[0]}

/* ---- Ortak veritabanından canlı okuma ---- */
onSnapshot(col,function(snap){
  rows=snap.docs.map(function(d){var v=d.data();v.id=d.id;return v});
  $('msg').classList.remove('bad');
  if($('msg').textContent===''||$('msg').dataset.err){say('');delete $('msg').dataset.err}
  render();
},function(e){
  console.error(e);
  $('msg').dataset.err='1';
  $('msg').textContent='Ortak veritabanına bağlanılamadı. İnternetinizi ve Firestore kurallarını kontrol edin.';
});

function render(){
  var total=rows.length,dn=rows.filter(function(x){return x.done}).length,op=total-dn,p=total?Math.round(dn*100/total):0;
  $('pct').textContent=p+'%';$('fg').style.strokeDashoffset=263.9*(1-p/100);
  $('s1').textContent=total;$('s2').textContent=op;$('s3').textContent=dn;
  $('c1').textContent=total;$('c2').textContent=op;$('c3').textContent=dn;
  $('sub').textContent=!total?'Henüz iş eklenmedi. Aşağıdan ilk işi ekleyin.':op?op+' iş seni bekliyor.':'Harika, tüm işler tamamlandı!';
  var q=query.toLocaleLowerCase('tr'),td=today();
  var shown=rows.filter(function(x){return(filter==='all'||(filter==='done'?x.done:!x.done))&&(!q||String(x.text||'').toLocaleLowerCase('tr').indexOf(q)>-1)});
  shown.sort(function(a,b){if(!!a.done!==!!b.done)return a.done?1:-1;if(!a.done&&a.due!==b.due){if(!a.due)return 1;if(!b.due)return-1;return a.due<b.due?-1:1}return(b.at||0)-(a.at||0)});
  var L=$('list');L.textContent='';
  if(!shown.length){var e=el('div','empty');e.appendChild(el('b',null,total?'🔍':'📝'));e.appendChild(document.createTextNode(total?'Bu görünümde iş yok.':'Liste boş.'));L.appendChild(e);return}
  shown.forEach(function(x){
    var r=el('div','it'+(x.kind==='rev'?' rev':'')+(x.done?' done':''));
    var c=el('input','chk');c.type='checkbox';c.checked=!!x.done;c.dataset.id=x.id;c.setAttribute('aria-label','Yapıldı olarak işaretle');r.appendChild(c);
    var b=el('div','bd');b.appendChild(el('div','tx',x.text));
    var m=el('div','meta');m.appendChild(el('span','pill'+(x.kind==='rev'?' rev':''),x.kind==='rev'?'Revizyon':'İş'));
    if(x.done)m.appendChild(el('span','pill ok','Yapıldı · '+fmt(x.doneAt||x.at)));
    else{if(x.due)m.appendChild(el('span','pill'+(x.due<td?' late':''),(x.due<td?'Gecikti · ':'Son: ')+fmtDue(x.due)));m.appendChild(el('span',null,'Eklendi '+fmt(x.at)))}
    b.appendChild(m);r.appendChild(b);
    var a=el('div','ac'),ed=el('button','ic','✎');ed.dataset.edit=x.id;ed.title='Düzenle';ed.setAttribute('aria-label','Düzenle');
    var de=el('button','ic'+(armed===x.id?' arm':''),armed===x.id?'Sil?':'×');de.dataset.del=x.id;de.title='Sil';de.setAttribute('aria-label','Sil');
    a.appendChild(ed);a.appendChild(de);r.appendChild(a);L.appendChild(r);
  });
}

function sync(){$('add').disabled=!$('t').value.trim()}
$('t').oninput=sync;
$('t').onkeydown=function(e){if(e.key==='Enter'&&!$('add').disabled)$('add').click()};
$('add').onclick=function(){
  var v=$('t').value.trim();if(!v)return;say('');
  var item={text:v,kind:$('k').value,done:false,at:Date.now(),doneAt:null,due:$('d').value||null};
  var id=newId();
  setDoc(doc(db,'isler',id),item).catch(function(e){fail(e)});
  $('t').value='';$('k').value='is';$('d').value='';
  sync();
};
$('list').onchange=function(e){
  var c=e.target.closest('input[data-id]');if(!c)return;
  updateDoc(doc(db,'isler',c.dataset.id),{done:c.checked,doneAt:c.checked?Date.now():null}).catch(function(e){fail(e)});
};
$('list').onclick=function(e){
  var ed=e.target.closest('button[data-edit]');
  if(ed){var r=find(ed.dataset.edit);var v=r&&prompt('İşi düzenle:',r.text);if(v&&v.trim()){updateDoc(doc(db,'isler',r.id),{text:v.trim().slice(0,300)}).catch(function(e){fail(e)})}return}
  var b=e.target.closest('button[data-del]');if(!b)return;
  if(armed!==b.dataset.del){armed=b.dataset.del;render();setTimeout(function(){if(armed){armed=null;render()}},3000);return}
  var id=armed;armed=null;
  deleteDoc(doc(db,'isler',id)).catch(function(e){fail(e,'Silinemedi. Tekrar deneyin.')});
  render();
};
$('tabs').onclick=function(e){
  var b=e.target.closest('button[data-f]');if(!b)return;filter=b.dataset.f;
  [].forEach.call($('tabs').children,function(x){x.classList.toggle('on',x===b)});render();
};
$('q').oninput=function(){query=this.value.trim();render()};

/* ---- Yedek al / yükle ---- */
$('exp').onclick=function(){
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(rows,null,1)],{type:'application/json'}));
  a.download='is-takibi-yedek-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();say('Yedek indirildi.');
};
async function bulkSet(list){
  for(var i=0;i<list.length;i+=400){
    var batch=writeBatch(db);
    list.slice(i,i+400).forEach(function(x){batch.set(doc(db,'isler',String(x.id)),x)});
    await batch.commit();
  }
}
function clean(d){
  if(!Array.isArray(d))return[];
  return d.filter(function(x){return x&&x.id&&x.text}).map(function(x){
    return{id:String(x.id),text:String(x.text).slice(0,300),kind:x.kind==='rev'?'rev':'is',done:!!x.done,at:x.at||Date.now(),doneAt:x.doneAt||null,due:x.due||null};
  });
}
$('imp').onclick=function(){$('file').click()};
$('file').onchange=function(){
  var f=this.files[0];if(!f)return;var rd=new FileReader();
  rd.onload=async function(){
    try{
      var list=clean(JSON.parse(rd.result));
      if(!list.length)throw 0;
      await bulkSet(list); // aynı kimlikli işler üzerine yazılır, çift kayıt oluşmaz
      say(list.length+' iş yedekten yüklendi.');
    }catch(e){say('Yedek dosyası okunamadı.')}
  };
  rd.readAsText(f);this.value='';
};

/* ---- Bu tarayıcıdaki eski yerel işleri ortak listeye aktarma ---- */
var legacy=[];
try{ legacy=clean(JSON.parse(localStorage.getItem(KEY)||'[]')); }catch(e){}
if(legacy.length && !localStorage.getItem(KEY+'-aktarildi')){
  $('mig').hidden=false;
  $('migText').textContent='Bu tarayıcıda eski listenizden '+legacy.length+' iş bulundu.';
  $('migBtn').onclick=async function(){
    this.disabled=true;
    try{
      await bulkSet(legacy);
      try{localStorage.setItem(KEY+'-aktarildi','1')}catch(e){}
      $('mig').hidden=true;
      say(legacy.length+' iş ortak listeye aktarıldı.');
    }catch(e){fail(e,'Aktarılamadı. Tekrar deneyin.');this.disabled=false}
  };
}
say('');
</script>

</body>
</html>
